[package]
name = "telegraph-comparator"
version = "0.1.0"
edition = "2021"
description = "Minimal comparator module for a Telegraph deterministic intent (registered on the DNS_RECORD_LOOKUP family). no_std, import-free WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
